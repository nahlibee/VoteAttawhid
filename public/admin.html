<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المشرف على الفرز</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <h1>لوحة المشرف على عملية الفرز</h1>
  <a href="/" target="_blank">صفحة النتائج العامة</a>
  <button class="link" id="logout" hidden>خروج</button>
</header>
<main>
  <div class="tabs" id="tabs" hidden>
    <button data-tab="rounds">الجولات والنتائج</button>
    <button data-tab="people">لائحة الأعضاء</button>
    <button data-tab="teams">فرق الفرز</button>
    <button data-tab="history">السجل</button>
    <button data-tab="settings">الإعدادات</button>
  </div>
  <div id="pending"></div>
  <div id="requests"></div>
  <div id="app"></div>
</main>
<dialog id="dlg"></dialog>
<script src="/common.js"></script>
<script>
TOKEN_KEY = 'tok_admin';
const app = $('#app');
const dlg = $('#dlg');
let state = null;
let tab = 'rounds';
let filter = '';

const TEMPLATES = {
  nomination: { label: 'انتخاب الرئيس: ترشيح الأسماء (3 إلى 5)', title: 'انتخاب الرئيس - الترشيح', mode: 'open', min: 3, max: 5, seats: 5, threshold: 'none' },
  president: { label: 'انتخاب الرئيس: التصويت على المرشحين', title: 'انتخاب الرئيس - التصويت', mode: 'list', min: 1, max: 1, seats: 1, threshold: 'absolute' },
  runoff: { label: 'انتخاب الرئيس: الإعادة بين الأول والثاني', title: 'انتخاب الرئيس - الدور الثاني', mode: 'list', min: 1, max: 1, seats: 1, threshold: 'present' },
  bureau: { label: 'المكتب الجهوي: التصويت على لائحة الرئيس', title: 'عضوية المكتب الجهوي - التصويت', mode: 'list', min: 1, max: 5, seats: 5, threshold: 'absolute' },
  bureau2: { label: 'المكتب الجهوي: إعادة التصويت', title: 'عضوية المكتب الجهوي - إعادة التصويت', mode: 'list', min: 1, max: 1, seats: 1, threshold: 'present' },
};
const THRESHOLDS = { none: 'بدون أغلبية (الأوائل حسب عدد الأصوات)', absolute: 'الأغلبية المطلقة (من العدد المقرر حضورهم)', present: 'أغلبية الحاضرين' };
const STATUS = { draft: 'لم تفتح بعد', open: 'مفتوحة للإدخال', closed: 'مغلقة' };

const act = async (fn, okMsg) => {
  try { await fn(); if (okMsg) toast(okMsg); await refresh(true); } catch (err) { toast(err.message, 'err'); }
};

// Cancelled papers now only appear for a team after a merge (or in older data).
const paperCount = (valid, cancelled) => `${valid} صحيحة` + (cancelled ? `، ${cancelled} ملغاة` : '');

// ---------- login / first setup ----------
// Notice of names added by the teams, shown on every tab until each one is decided.
let pendingKey = '';
let pendingSeen = null;
function renderPending() {
  const list = state ? state.people.filter((p) => p.pending) : [];
  const waiting = list.length + (state?.deleteRequests?.length || 0);
  document.title = (waiting ? `(${waiting}) ` : '') + 'المشرف على الفرز';
  if (pendingSeen && list.some((p) => !pendingSeen.has(p.id))) {
    toast(`اسم جديد يحتاج إلى قرارك: ${list.filter((p) => !pendingSeen.has(p.id)).map((p) => p.name).join(' ، ')}`, 'err');
  }
  pendingSeen = new Set(list.map((p) => p.id));
  const key = JSON.stringify(list);
  if (key === pendingKey) return;
  pendingKey = key;
  const decide = (p, isMember) => act(() => api('PATCH', '/people/' + p.id, { isMember }),
    isMember ? `تمت المصادقة على «${p.name}»: تحتسب أصواته الآن` : `تم رفض «${p.name}»: لا تحتسب أصواته`);
  $('#pending').replaceChildren(...(list.length ? [h('section', { class: 'card alert noprint' },
    h('h2', {}, `أسماء جديدة أضافتها فرق الفرز (${list.length}): تحتاج إلى قرارك`),
    h('p', { class: 'muted' }, 'هذه الأسماء غير موجودة في لائحة الأعضاء. لا تحتسب أصواتها حتى تصادق عليها. إذا كان الاسم مكتوبا بطريقة أخرى لعضو موجود، استعمل «نفس عضو موجود».'),
    h('table', {}, h('tbody', {}, list.map((p) => h('tr', {},
      h('td', {}, h('b', {}, p.name), h('div', { class: 'muted' }, `أضافه ${p.addedBy || '؟'} · ورد في ${p.papers} ورقة`)),
      h('td', { class: 'row', style: 'justify-content:flex-end' },
        h('button', { class: 'small primary', onclick: () => decide(p, true) }, 'مصادقة: عضو'),
        h('button', { class: 'small danger', onclick: () => {
          if (confirm(`رفض «${p.name}»؟ لن تحتسب أصواته.`)) decide(p, false);
        } }, 'رفض: ليس عضوا'),
        h('button', { class: 'small', onclick: () => mergeDialog(p) }, 'نفس عضو موجود')))))))] : []));
}

// Notice of papers a team asks to delete. A paper stays counted until accepted.
let requestsKey = '';
let requestsSeen = null;
function renderRequests() {
  const list = (state && state.deleteRequests) || [];
  const fresh = requestsSeen ? list.filter((b) => !requestsSeen.has(b.id)) : [];
  if (fresh.length) toast(`طلب حذف ورقة من: ${[...new Set(fresh.map((b) => b.team))].join(' ، ')}`, 'err');
  requestsSeen = new Set(list.map((b) => b.id));
  const nameOf = (id) => state.people.find((p) => p.id === id)?.name || '؟';
  const rows = list.map((b) => ({ ...b, text: b.cancelled ? 'ورقة ملغاة' : b.choices.map(nameOf).join(' ، ') }));
  const key = JSON.stringify(rows);
  if (key === requestsKey) return;
  requestsKey = key;
  $('#requests').replaceChildren(...(rows.length ? [h('section', { class: 'card alert noprint' },
    h('h2', {}, `طلبات حذف أوراق من فرق الفرز (${rows.length}): تحتاج إلى قرارك`),
    h('p', { class: 'muted' }, 'تبقى الورقة محتسبة حتى تقبل حذفها.'),
    h('table', {}, h('tbody', {}, rows.map((b) => h('tr', {},
      h('td', {}, h('b', {}, b.text), h('div', { class: 'muted' }, `#${b.id} · ${b.team} · ${b.roundTitle}`)),
      h('td', { class: 'row', style: 'justify-content:flex-end' },
        h('button', { class: 'small danger', onclick: () => {
          if (confirm('قبول حذف هذه الورقة؟ لن تحتسب بعد الآن.')) act(() => api('DELETE', '/ballots/' + b.id), 'تم حذف الورقة');
        } }, 'قبول الحذف'),
        h('button', { class: 'small', onclick: () => act(() => api('PATCH', '/ballots/' + b.id, {}), 'تم رفض الحذف: تبقى الورقة محتسبة') }, 'رفض')))))))] : []));
}

async function showLogin() {
  $('#pending').replaceChildren();
  pendingKey = '';
  pendingSeen = null;
  $('#requests').replaceChildren();
  requestsKey = '';
  requestsSeen = null;
  $('#tabs').hidden = true;
  $('#logout').hidden = true;
  const pub = await api('GET', '/public').catch(() => ({ ready: true }));
  const code = h('input', { type: 'password', autocomplete: 'off' });
  const form = h('form', { class: 'card login', onsubmit: async (e) => {
    e.preventDefault();
    try {
      if (!pub.ready) await api('POST', '/setup', { supervisorCode: code.value });
      const s = await api('POST', '/login', { role: 'supervisor', code: code.value });
      setToken(s.token);
      refresh(true);
    } catch (err) { toast(err.message, 'err'); }
  } },
    h('h2', {}, pub.ready ? 'دخول المشرف' : 'الإعداد الأول للبرنامج'),
    !pub.ready && h('p', { class: 'muted' }, 'اختر رمزا سريا للمشرف (يبقى عندك فقط). بعد الدخول تنشئ فرق الفرز ولكل فريق رمزه.'),
    h('div', { class: 'field' }, h('label', {}, 'رمز المشرف'), code),
    h('button', { class: 'primary big' }, pub.ready ? 'دخول' : 'حفظ ودخول'));
  app.replaceChildren(form);
  code.focus();
}

async function refresh(force) {
  if (!getToken()) return showLogin();
  try {
    const next = await api('GET', '/admin/state');
    const changed = JSON.stringify(next) !== JSON.stringify(state);
    state = next;
    renderPending();
    renderRequests();
    $('#tabs').hidden = false;
    $('#logout').hidden = false;
    // Live refresh only touches the tabs without forms to fill, so typing is never interrupted.
    if (force || (changed && ['rounds', 'teams', 'history'].includes(tab) && !app.contains(document.activeElement))) render();
  } catch (err) {
    if (err.status === 401) { setToken(null); showLogin(); }
  }
}

function render() {
  for (const b of $('#tabs').children) b.classList.toggle('on', b.dataset.tab === tab);
  ({ rounds: renderRounds, people: renderPeople, teams: renderTeams, history: renderHistory, settings: renderSettings })[tab]();
}

// ---------- rounds ----------
function renderRounds() {
  const s = state.settings;
  const warn = !s.present;
  app.replaceChildren(
    h('div', { class: 'card noprint' },
      h('div', { class: 'row' },
        h('div', { class: 'grow' },
          h('div', {}, `العدد المقرر حضورهم: ${s.expected} ← الأغلبية المطلقة: ${s.absolute}`),
          h('form', { class: 'row', onsubmit: (e) => {
            e.preventDefault();
            act(() => api('PUT', '/settings', { present: Number(e.target.elements.present.value) }), 'تم تحديث عدد الحاضرين: يطبق على الجولات غير المغلقة');
          } },
            h('label', { style: 'margin:0' }, 'عدد الحاضرين الآن:'),
            h('input', { type: 'number', name: 'present', min: 0, value: s.present }),
            h('button', { class: 'small' }, 'تحديث'),
            h('span', {}, warn ? 'لم يحدد بعد' : `← أغلبية الحاضرين: ${s.presentMajority}`)),
          h('div', { class: 'muted' }, 'يمكن تغيير عدد الحاضرين في أي وقت: يطبق على الجولات المفتوحة أو التي لم تفتح بعد، ولا يغير نتائج الجولات المغلقة.'),
          h('div', { class: 'muted' }, state.teams.length
            ? `الفرق: ${state.teams.map((t) => `${t.name}: ${paperCount(t.ballots, t.cancelled)}`).join(' | ')}`
            : 'لا يوجد أي فريق بعد: أنشئ الفرق من تبويب «فرق الفرز».'),
          h('div', { class: 'muted' }, `الأسماء في اللائحة: ${state.people.length} (منهم ${state.people.filter((p) => p.isMember).length} عضوا)`)),
        h('button', { class: 'primary', onclick: () => roundDialog() }, '＋ جولة جديدة'),
        h('button', { onclick: () => window.print() }, 'طباعة النتائج'))),
    ...(state.rounds.length ? state.rounds.map(roundCard) : [h('div', { class: 'card' }, h('p', { class: 'muted' },
      'لا توجد أي جولة. ابدأ بإدخال لائحة الأعضاء وعدد الحاضرين، ثم أنشئ الجولة الأولى (ترشيح الأسماء لرئاسة الجهة).'))]));
}

function roundCard(r) {
  const res = r.results;
  const patch = (body, msg) => act(() => api('PATCH', '/rounds/' + r.id, body), msg);
  const voidInput = h('input', { type: 'number', min: 0, value: r.void });
  const over = res.present && res.total > res.present;
  const teams = Object.entries(r.perTeam).map(([t, n]) => `${t}: ${paperCount(n.valid, n.cancelled)}`).join(' | ');
  const next = nextRound(r);
  return h('section', { class: 'card' },
    h('div', { class: 'row' },
      h('h2', { class: 'grow' }, r.title,
        h('span', { class: 'badge ' + r.status }, STATUS[r.status]),
        r.published && h('span', { class: 'badge ok' }, 'منشورة للعموم')),
      h('div', { class: 'row noprint' },
        r.status !== 'open' && h('button', { class: 'primary', onclick: () => {
          if (r.status === 'closed' && (r.frozen?.present !== state.settings.present || r.frozen?.expected !== state.settings.expected)
            && !confirm(`أغلقت هذه الجولة بعدد حاضرين ${r.frozen?.present}. عند إعادة فتحها تعتمد العدد الحالي (${state.settings.present}). متابعة؟`)) return;
          patch({ status: 'open' }, 'الجولة مفتوحة للإدخال');
        } }, r.status === 'closed' ? 'إعادة فتح الإدخال' : 'فتح الإدخال'),
        r.status === 'open' && h('button', { class: 'primary', onclick: () => patch({ status: 'closed' }, 'تم إغلاق الجولة') }, 'إغلاق الإدخال'),
        h('button', { onclick: () => patch({ published: !r.published }, r.published ? 'تم إخفاء النتيجة' : 'تم نشر النتيجة') }, r.published ? 'إخفاء عن العموم' : 'نشر النتيجة للعموم'),
        !(res.valid + res.voidTeams) && h('button', { onclick: () => roundDialog(r) }, 'تعديل'),
        h('button', { onclick: () => ballotsDialog(r) }, 'الأوراق'),
        h('button', { class: 'danger', onclick: () => {
          if (confirm(`حذف الجولة «${r.title}» مع جميع أوراقها (${res.valid})؟ لا يمكن التراجع.`)) act(() => api('DELETE', '/rounds/' + r.id), 'تم الحذف');
        } }, 'حذف'))),
    h('p', { class: 'muted' },
      `${r.mode === 'open' ? 'ترشيح حر من اللائحة' : `${r.candidates.length} مرشحين`} · كل ورقة: ${r.min === r.max ? r.min : `${r.min} إلى ${r.max}`} · المقاعد: ${r.seats} · ${THRESHOLDS[r.threshold]}`),
    h('div', { class: 'row noprint', style: 'margin-bottom:10px' },
      h('label', { style: 'margin:0' }, 'أوراق ملغاة يضيفها المشرف:'), voidInput,
      h('button', { class: 'small', onclick: () => patch({ void: Number(voidInput.value) }, 'تم الحفظ') }, 'حفظ'),
      teams && h('span', { class: 'muted' }, teams),
      h('span', { class: 'muted' }, `مجموع الملغاة: ${res.void}` + (res.voidTeams ? ` (من الأوراق المدخلة: ${res.voidTeams}، المشرف: ${res.voidManual})` : ''))),
    res.rows.some((x) => x.pending && x.votes) && h('div', { class: 'verdict warn' },
      `أسماء في انتظار مصادقتك قد تغير هذه النتيجة: ${res.rows.filter((x) => x.pending && x.votes).map((x) => `${x.name} (${x.votes})`).join(' ، ')}`),
    (state.deleteRequests || []).some((b) => b.roundId === r.id) && h('div', { class: 'verdict warn' },
      `طلبات حذف أوراق في انتظار قرارك في هذه الجولة: ${state.deleteRequests.filter((b) => b.roundId === r.id).length}`),
    over && h('div', { class: 'verdict warn' }, `تنبيه: مجموع الأوراق (${res.total}) أكبر من عدد الحاضرين (${state.settings.present}).`),
    r.threshold === 'present' && res.thresholdMissing && h('div', { class: 'verdict warn' }, 'يجب تحديد عدد الحاضرين لحساب أغلبية الحاضرين.'),
    h('p', { class: 'muted' }, r.frozen
      ? `اعتمدت هذه الجولة عند إغلاقها: الحاضرون ${r.frozen.present}، المقرر حضورهم ${r.frozen.expected}. تغيير الأعداد لا يؤثر عليها.`
      : `تعتمد هذه الجولة العدد الحالي: الحاضرون ${res.present}، المقرر حضورهم ${res.expected}. يجمد عند الإغلاق.`),
    h('div', { class: r.mode === 'open' ? 'scroll' : '' }, resultsView(r, res)),
    next && res.valid > 0 && h('p', { class: 'noprint' }, h('button', { class: 'primary', onclick: () => roundDialog(null, next) }, `إنشاء الجولة التالية: ${TEMPLATES[next.kind].label}`)));
}

function roundDialog(existing, preset) {
  const init = existing || { ...TEMPLATES[preset?.kind || 'nomination'], kind: preset?.kind || 'nomination', candidates: [], ...preset };
  let cands = [...(init.candidates || [])];
  const kind = h('select', {}, Object.entries(TEMPLATES).map(([k, t]) => h('option', { value: k, selected: k === init.kind }, t.label)));
  const title = h('input', { type: 'text', value: init.title });
  const min = h('input', { type: 'number', min: 1, value: init.min });
  const max = h('input', { type: 'number', min: 1, value: init.max });
  const seats = h('input', { type: 'number', min: 1, value: init.seats });
  const threshold = h('select', {}, Object.entries(THRESHOLDS).map(([k, t]) => h('option', { value: k, selected: k === init.threshold }, t)));
  const chips = h('div', { class: 'chips' });
  const candBox = h('div', { class: 'field' });
  let mode = init.mode;

  const drawChips = () => chips.replaceChildren(...cands.map((id) => {
    const p = state.people.find((x) => x.id === id);
    return h('span', { class: 'chip' }, p ? p.name : '؟', h('button', { type: 'button', onclick: () => { cands = cands.filter((x) => x !== id); drawChips(); } }, '×'));
  }));
  const allowed = () => (mode === 'list' ? allowedCandidates(state.rounds, kind.value, existing && existing.id) : null);
  const picker = namePicker({
    people: () => {
      const a = allowed();
      return state.people.filter((p) => p.isMember && (!a || a.ids.includes(p.id)));
    },
    exclude: () => new Set(cands),
    onPick: (p) => { cands.push(p.id); drawChips(); picker.focus(); },
    placeholder: 'أضف مرشحا: اكتب الحروف الأولى من اسمه…',
  });
  const drawMode = () => {
    candBox.replaceChildren(...(mode === 'list'
      ? [h('label', {}, allowed() ? `لائحة المرشحين (من المحتفظ بهم في «${allowed().title}» فقط)` : 'لائحة المرشحين (من أعضاء الجمع العام)'), picker.el, chips]
      : [h('p', { class: 'muted' }, 'في هذه الجولة يكتب كل عضو الأسماء بحرية، وتختارها فرق الفرز من لائحة الأعضاء.')]));
  };
  kind.onchange = () => {
    const t = TEMPLATES[kind.value];
    title.value = t.title; min.value = t.min; max.value = t.max; seats.value = t.seats; threshold.value = t.threshold;
    mode = t.mode;
    // Drop names that are not allowed for the new type.
    const a = allowed();
    if (a) { cands = cands.filter((id) => a.ids.includes(id)); drawChips(); }
    drawMode();
  };
  drawMode();
  drawChips();

  const form = h('form', { onsubmit: (e) => {
    e.preventDefault();
    const config = { kind: kind.value, title: title.value, mode, candidates: cands, min: Number(min.value), max: Number(max.value), seats: Number(seats.value), threshold: threshold.value };
    act(async () => {
      if (existing) await api('PATCH', '/rounds/' + existing.id, { config }); else await api('POST', '/rounds', config);
      dlg.close();
    }, 'تم حفظ الجولة');
  } },
    h('h2', {}, existing ? 'تعديل الجولة' : 'جولة جديدة'),
    h('div', { class: 'field' }, h('label', {}, 'نوع الجولة'), kind),
    h('div', { class: 'field' }, h('label', {}, 'العنوان'), title),
    candBox,
    h('div', { class: 'row field' },
      h('div', {}, h('label', {}, 'أقل عدد أسماء في الورقة'), min),
      h('div', {}, h('label', {}, 'أكبر عدد أسماء في الورقة'), max),
      h('div', {}, h('label', {}, 'عدد المقاعد / المحتفظ بهم'), seats)),
    h('div', { class: 'field' }, h('label', {}, 'شرط الفوز'), threshold),
    h('div', { class: 'row' },
      h('button', { class: 'primary' }, 'حفظ'),
      h('button', { type: 'button', onclick: () => dlg.close() }, 'إلغاء')));
  dlg.replaceChildren(form);
  dlg.showModal();
}

async function ballotsDialog(r) {
  const ballots = await api('GET', `/rounds/${r.id}/ballots`).catch((e) => { toast(e.message, 'err'); return null; });
  if (!ballots) return;
  const name = (id) => state.people.find((p) => p.id === id)?.name || '؟';
  dlg.replaceChildren(
    h('h2', {}, `أوراق الجولة: ${r.title} (${ballots.length})`),
    h('div', { class: 'scroll' }, h('table', {}, h('tbody', {}, ballots.slice().reverse().map((b) => h('tr', {},
      h('td', { class: 'muted' }, `#${b.id} · ${b.team}`),
      h('td', {}, b.cancelled ? h('span', { class: 'badge warn' }, b.cancelledByMerge ? 'ملغاة بعد الدمج' : 'ورقة ملغاة') : b.choices.map(name).join(' ، '),
        b.dropped && h('span', { class: 'badge warn' }, `مكرر لا يحتسب: ${b.dropped.map(name).join(' ، ')}`),
        b.ignored && h('span', { class: 'badge warn' }, `أسماء خارج اللائحة لا تحتسب: ${b.ignored}`),
        b.deleteRequest && h('span', { class: 'badge warn' }, 'طلب حذف'),
        b.short && h('span', { class: 'badge warn' }, 'ملغاة: بقي أقل من الحد بعد رفض اسم')),
      h('td', {}, h('button', { class: 'small danger', onclick: () => {
        if (confirm('حذف هذه الورقة؟')) act(async () => { await api('DELETE', '/ballots/' + b.id); dlg.close(); }, 'تم حذف الورقة');
      } }, 'حذف'))))))),
    h('p', {}, h('button', { onclick: () => dlg.close() }, 'إغلاق')));
  dlg.showModal();
}

// ---------- people ----------
function renderPeople() {
  const one = h('input', { type: 'text', placeholder: 'الاسم الكامل' });
  const bulk = h('textarea', { placeholder: 'ألصق هنا لائحة الأعضاء: اسم واحد في كل سطر (يمكن نسخ عمود الأسماء مباشرة من ملف Excel)' });
  const search = h('input', { type: 'text', placeholder: 'بحث في اللائحة…', value: filter });
  const listBox = h('div', { class: 'scroll' });
  const drawList = () => {
    const shown = filter ? searchPeople(state.people, filter, 500) : state.people;
    const sorted = shown.slice().sort((a, b) => a.isMember - b.isMember || a.name.localeCompare(b.name, 'ar'));
    listBox.replaceChildren(h('table', {}, h('tbody', {}, sorted.map((p) => h('tr', {},
      h('td', {}, p.name, h('span', { class: 'badge ' + (p.isMember ? 'ok' : 'warn') }, p.isMember ? 'عضو' : p.pending ? 'في انتظار المصادقة' : 'غير عضو')),
      h('td', { class: 'row', style: 'justify-content:flex-end' },
        !p.isMember && h('button', { class: 'small primary', onclick: () => act(() => api('PATCH', '/people/' + p.id, { isMember: true }), 'تم اعتماده كعضو، وأصواته تحتسب الآن') }, 'اعتماده كعضو'),
        p.isMember && h('button', { class: 'small', onclick: () => {
          if (confirm(`إزالة صفة العضوية عن «${p.name}»؟`)) act(() => api('PATCH', '/people/' + p.id, { isMember: false }));
        } }, 'إزالة العضوية'),
        h('button', { class: 'small', onclick: () => {
          const name = prompt('تصحيح الاسم:', p.name);
          if (name && name.trim() !== p.name) act(() => api('PATCH', '/people/' + p.id, { name }), 'تم التصحيح');
        } }, 'تصحيح'),
        h('button', { class: 'small', onclick: () => mergeDialog(p) }, 'دمج'),
        !p.used && h('button', { class: 'small danger', onclick: () => {
          if (confirm(`حذف «${p.name}» من اللائحة؟`)) act(() => api('DELETE', '/people/' + p.id), 'تم الحذف');
        } }, 'حذف')))))));
  };
  search.oninput = () => { filter = search.value; drawList(); };
  const nonMembers = state.people.filter((p) => !p.isMember).length;
  app.replaceChildren(
    h('div', { class: 'card' },
      h('h2', {}, 'إضافة عضو'),
      h('form', { class: 'row', onsubmit: (e) => {
        e.preventDefault();
        act(() => api('POST', '/people', { name: one.value, isMember: true }), 'تمت الإضافة كعضو');
      } }, h('div', { class: 'grow' }, one), h('button', { class: 'primary' }, 'إضافة كعضو')),
      h('p', { class: 'muted' }, 'إذا كان الاسم قد أدخلته فرق الفرز من قبل كـ«غير عضو»، يصبح عضوا وتحتسب أصواته تلقائيا.'),
      h('h3', {}, 'إدخال اللائحة كاملة'),
      bulk,
      h('p', {}, h('button', { class: 'primary', onclick: () => act(async () => {
        const r = await api('POST', '/people/import', { text: bulk.value });
        toast(`تمت إضافة ${r.added} اسما من أصل ${r.total}`);
      }) }, 'إضافة اللائحة'))),
    h('div', { class: 'card' },
      h('h2', {}, `اللائحة: ${state.people.length} اسما`, nonMembers ? h('span', { class: 'badge warn' }, `${nonMembers} غير عضو`) : null),
      h('div', { class: 'field' }, search),
      listBox));
  drawList();
}

function mergeDialog(from) {
  let target = null;
  const chosen = h('p', { class: 'muted' }, 'لم يتم اختيار أي اسم.');
  const picker = namePicker({
    people: () => state.people.filter((p) => p.id !== from.id),
    onPick: (p) => { target = p; chosen.textContent = `سيتم الدمج في: ${p.name}`; },
    placeholder: 'الاسم الصحيح…',
  });
  dlg.replaceChildren(
    h('h2', {}, `دمج «${from.name}»`),
    h('p', { class: 'muted' }, 'يستعمل عندما يكتب نفس الشخص بطريقتين. تنقل جميع أصوات هذا الاسم إلى الاسم الصحيح ثم يحذف. إذا كانت ورقة تضم الكتابتين معا، يعتبر الاسم مكررا ولا يحتسب فيها.'),
    picker.el, chosen,
    h('div', { class: 'row', style: 'margin-top:160px' },
      h('button', { class: 'primary', onclick: () => {
        if (!target) return toast('اختر الاسم الصحيح أولا', 'err');
        act(async () => {
          const res = await api('POST', '/people/merge', { from: from.id, to: target.id });
          dlg.close();
          const lost = Object.entries(res.cancelled || {});
          if (lost.length) {
            toast('تم الدمج. أوراق أصبحت ملغاة بسبب تكرار الاسم (احتسبت تلقائيا ضمن الملغاة): '
              + lost.map(([t, n]) => `${t}: ${n}`).join(' | '), 'err');
          } else toast('تم الدمج');
        });
      } }, 'دمج'),
      h('button', { onclick: () => dlg.close() }, 'إلغاء')));
  dlg.showModal();
  picker.focus();
}

// ---------- teams ----------
function renderTeams() {
  app.replaceChildren(h('div', { class: 'card' },
    h('div', { class: 'row' },
      h('h2', { class: 'grow' }, `فرق الفرز: ${state.teams.length}`),
      h('button', { class: 'primary', onclick: () => act(() => api('POST', '/teams'), 'تم إنشاء الفريق') }, '＋ إنشاء فريق')),
    h('p', { class: 'muted' }, 'سلم لكل فريق رمزه يدويا. كل فريق يعمل على جهاز واحد فقط. إذا تعطل الجهاز، اضغط «رمز جديد» ليدخل الفريق من جهاز آخر.'),
    state.teams.length ? h('div', { class: 'scroll' }, h('table', {}, h('tbody', {}, state.teams.map((t) => h('tr', {},
      h('td', {}, h('b', {}, t.name), h('span', { class: 'badge' + (t.inUse ? ' ok' : '') }, t.inUse ? 'مفتوح على جهاز' : 'لم يدخل بعد'),
        h('div', { class: 'muted' }, paperCount(t.ballots, t.cancelled))),
      h('td', {}, h('b', { dir: 'ltr', style: 'font-size:1.2rem' }, t.code)),
      h('td', { class: 'row', style: 'justify-content:flex-end' },
        h('button', { class: 'small', onclick: () => {
          if (confirm(`إنشاء رمز جديد لـ«${t.name}»؟ يتوقف الرمز الحالي ويخرج الجهاز المفتوح، ويمكن للفريق الدخول من جهاز آخر.`)) act(() => api('POST', `/teams/${t.id}/code`), 'تم إنشاء رمز جديد');
        } }, 'رمز جديد'),
        !(t.ballots + t.cancelled) && h('button', { class: 'small danger', onclick: () => {
          if (confirm(`حذف «${t.name}»؟`)) act(() => api('DELETE', '/teams/' + t.id), 'تم حذف الفريق');
        } }, 'حذف')))))))
      : h('p', { class: 'muted' }, 'لا يوجد أي فريق بعد.')));
}

// ---------- history ----------
async function renderHistory() {
  const items = await api('GET', '/history').catch((e) => { toast(e.message, 'err'); return null; });
  if (!items || tab !== 'history') return;
  app.replaceChildren(h('div', { class: 'card' },
    h('h2', {}, `سجل التغييرات: ${items.length}`),
    h('p', { class: 'muted' }, 'كل تغيير يسجل هنا بوقته وصاحبه، ولا يمكن تعديله أو حذفه من البرنامج. الأحدث أولا.'),
    items.length ? h('div', { class: 'scroll' }, h('table', {}, h('tbody', {}, items.map((e) => h('tr', {},
      h('td', { class: 'muted', dir: 'ltr', style: 'white-space:nowrap' }, new Date(e.at).toLocaleString('fr-MA', { dateStyle: 'short', timeStyle: 'medium' })),
      h('td', { style: 'white-space:nowrap' }, e.who),
      h('td', {}, e.text))))))
      : h('p', { class: 'muted' }, 'لا يوجد أي تغيير بعد.')));
}

// ---------- settings ----------
// The address to give to others: the app's name rather than localhost or an IP.
const shareOrigin = () => (/^(localhost$|\d+\.\d+\.\d+\.\d+$)/.test(location.hostname)
  ? `${location.protocol}//voteattawhid.local${location.port ? ':' + location.port : ''}`
  : location.origin);

function renderSettings() {
  const s = state.settings;
  const expected = h('input', { type: 'number', min: 1, value: s.expected });
  const present = h('input', { type: 'number', min: 0, value: s.present });
  const supCode = h('input', { type: 'password', autocomplete: 'new-password', placeholder: 'اتركه فارغا إذا لم ترد تغييره' });
  app.replaceChildren(
    h('form', { class: 'card', onsubmit: (e) => {
      e.preventDefault();
      act(() => api('PUT', '/settings', { expected: Number(expected.value), present: Number(present.value) }), 'تم الحفظ');
    } },
      h('h2', {}, 'أعداد الجمع العام'),
      h('div', { class: 'field' }, h('label', {}, 'العدد المقرر حضورهم في الجمع العام (تحسب منه الأغلبية المطلقة)'), expected),
      h('div', { class: 'field' }, h('label', {}, 'عدد الحاضرين فعليا (تحسب منه أغلبية الحاضرين)'), present),
      h('p', { class: 'muted' }, `حاليا: الأغلبية المطلقة = ${s.absolute} · أغلبية الحاضرين = ${s.present ? s.presentMajority : '—'}`),
      h('button', { class: 'primary' }, 'حفظ')),
    h('form', { class: 'card', onsubmit: (e) => {
      e.preventDefault();
      act(() => api('PUT', '/settings', { supervisorCode: supCode.value || undefined }), 'تم الحفظ');
    } },
      h('h2', {}, 'رمز المشرف'),
      h('div', { class: 'field' }, h('label', {}, 'رمز جديد للمشرف'), supCode),
      h('button', { class: 'primary' }, 'حفظ')),
    h('div', { class: 'card' },
      h('h2', {}, 'عناوين الصفحات'),
      h('p', {}, 'فرق الفرز: ', h('b', { dir: 'ltr' }, shareOrigin() + '/team')),
      h('p', {}, 'النتائج العامة (للعرض على الشاشة): ', h('b', { dir: 'ltr' }, shareOrigin() + '/'))));
}

$('#tabs').addEventListener('click', (e) => {
  if (e.target.dataset.tab) { tab = e.target.dataset.tab; render(); }
});
$('#logout').onclick = () => { setToken(null); state = null; showLogin(); };
refresh(true);
setInterval(() => { if (getToken() && state && !dlg.open) refresh(); }, 3000);
</script>
</body>
</html>
